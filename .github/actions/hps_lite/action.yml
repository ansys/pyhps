name: 'Download hps-lite'

description: 'Download and extract the hps-lite release asset for the current runner'

inputs:
  token:
    description: 'GitHub token with access to ansys-internal/hps-lite'
    required: true
  start:
    description: 'Whether to start hps-lite after extracting it'
    required: false
    default: 'false'

outputs:
  path:
    description: 'Path to the extracted hps-lite executable'
    value: ${{ steps['extract-linux'].outputs.path || steps['extract-windows'].outputs.path }}
  url:
    description: 'Base URL reported by hps-lite'
    value: ${{ steps['status-linux'].outputs.url || steps['status-windows'].outputs.url }}
  api-key:
    description: 'API key reported by hps-lite'
    value: ${{ steps['status-linux'].outputs['api-key'] || steps['status-windows'].outputs['api-key'] }}

runs:
  using: composite
  steps:
    - name: Download Linux hps-lite asset
      if: runner.os == 'Linux'
      uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
      with:
        file: hps-lite-lin-x64.tar.gz
        target: hps-lite.tar.gz
        repo: ansys-internal/hps-lite
        version: latest
        token: ${{ inputs.token }}

    - name: Download Windows hps-lite asset
      if: runner.os == 'Windows'
      uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
      with:
        file: hps-lite-win-x64.tar.gz
        target: hps-lite.tar.gz
        repo: ansys-internal/hps-lite
        version: latest
        token: ${{ inputs.token }}

    - name: Extract Linux hps-lite
      if: runner.os == 'Linux'
      id: extract-linux
      shell: bash
      run: |
        set -e
        tar -xzf hps-lite.tar.gz -C .
        hps_lite_path="$GITHUB_WORKSPACE/hps-lite-lin-x64/hps-lite"
        if [ ! -f "$hps_lite_path" ]; then
          echo "hps-lite executable was not found in the release archive"
          find . -maxdepth 4 -type f -print
          exit 1
        fi
        chmod +x "$hps_lite_path"
        hps_lite_dir=$(dirname "$hps_lite_path")
        echo "path=$hps_lite_path" >> "$GITHUB_OUTPUT"
        echo "working-directory=$hps_lite_dir" >> "$GITHUB_OUTPUT"

    - name: Extract Windows hps-lite
      if: runner.os == 'Windows'
      id: extract-windows
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        tar -xzf hps-lite.tar.gz -C .
        $hpsLitePath = Join-Path $env:GITHUB_WORKSPACE 'hps-lite-win-x64/hps-lite.exe'
        if (-not (Test-Path -PathType Leaf $hpsLitePath)) {
          Write-Error 'hps-lite executable was not found in the release archive'
        }
        $hpsLite = Get-Item $hpsLitePath
        Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($hpsLite.FullName)"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "working-directory=$($hpsLite.DirectoryName)"

    - name: Start Linux hps-lite
      if: runner.os == 'Linux' && inputs.start == 'true'
      shell: bash
      env:
        HPS_LITE_PATH: ${{ steps['extract-linux'].outputs.path }}
        HPS_LITE_WORKING_DIRECTORY: ${{ steps['extract-linux'].outputs['working-directory'] }}
      run: |
        set -e
        cd "$HPS_LITE_WORKING_DIRECTORY"
        nohup "$HPS_LITE_PATH" run --json > "$GITHUB_WORKSPACE/hps-lite.log" 2>&1 &
        echo $! > hps-lite.pid

    - name: Start Windows hps-lite
      if: runner.os == 'Windows' && inputs.start == 'true'
      shell: pwsh
      env:
        HPS_LITE_PATH: ${{ steps['extract-windows'].outputs.path }}
        HPS_LITE_WORKING_DIRECTORY: ${{ steps['extract-windows'].outputs['working-directory'] }}
      run: |
        $ErrorActionPreference = 'Stop'
        $process = Start-Process `
          -FilePath $env:HPS_LITE_PATH `
          -ArgumentList @('run', '--json') `
          -WorkingDirectory $env:HPS_LITE_WORKING_DIRECTORY `
          -RedirectStandardOutput "$PWD/hps-lite.log" `
          -RedirectStandardError "$PWD/hps-lite-error.log" `
          -PassThru
        $process.Id | Set-Content "$PWD/hps-lite.pid"

    - name: Query Linux hps-lite status
      if: runner.os == 'Linux' && inputs.start == 'true'
      id: status-linux
      shell: bash
      env:
        HPS_LITE_PATH: ${{ steps['extract-linux'].outputs.path }}
        HPS_LITE_WORKING_DIRECTORY: ${{ steps['extract-linux'].outputs['working-directory'] }}
      run: |
        set -e
        cd "$HPS_LITE_WORKING_DIRECTORY"
        status_json=$("$HPS_LITE_PATH" run --json)
        readarray -t status_values < <(STATUS_JSON="$status_json" python -c '
        import json
        import os

        payload = json.loads(os.environ["STATUS_JSON"])
        if payload.get("status") != "running":
            raise SystemExit("hps-lite is not running")
        print(payload["url"])
        print(payload.get("api_key", ""))
        ')
        hps_lite_url="${status_values[0]%/}/hps"
        hps_lite_api_key="${status_values[1]}"
        echo "::add-mask::$hps_lite_api_key"
        echo "url=$hps_lite_url" >> "$GITHUB_OUTPUT"
        echo "api-key=$hps_lite_api_key" >> "$GITHUB_OUTPUT"

    - name: Query Windows hps-lite status
      if: runner.os == 'Windows' && inputs.start == 'true'
      id: status-windows
      shell: pwsh
      env:
        HPS_LITE_PATH: ${{ steps['extract-windows'].outputs.path }}
        HPS_LITE_WORKING_DIRECTORY: ${{ steps['extract-windows'].outputs['working-directory'] }}
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Location $env:HPS_LITE_WORKING_DIRECTORY
        $status = & $env:HPS_LITE_PATH run --json | ConvertFrom-Json
        if ($status.status -ne 'running') {
          throw 'hps-lite is not running'
        }
        $apiKey = [string]$status.api_key
        Write-Output "::add-mask::$apiKey"
        $hpsLiteUrl = "$($status.url.TrimEnd('/'))/hps"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "url=$hpsLiteUrl"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "api-key=$apiKey"
