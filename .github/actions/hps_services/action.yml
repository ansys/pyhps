name: 'Local HPS Deployment'

description: 'Docker Compose-based local HPS deployment'

inputs:
  
  version:
    description: 'HPS version'
    required: true

  feature:
    description: 'HPS feature (only for latest-dev version)'
    required: false

  token:
    description: 'Token to access ansys/hps-release-mirror and configure Docker Compose'
    required: true

  ghcr-username:
    description: 'Username to access the GitHub container registry'
    required: true
  
  ghcr-token:
    description: 'Token to access the GitHub container registry'
    required: true

  profile:
    description: 'Docker compose profiles to use'
    required: false

outputs:
  url:
    description: 'HPS URL'
    value: ${{ steps.set-outputs.outputs.url }}

  path:
    description: 'Path of the docker compose artifact'
    value: ${{ steps.set-outputs.outputs.path }}
  
runs:
  using: "composite"
  
  steps:
    - if: ${{ inputs.version != 'latest-dev' }}
      uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
      name: Download Customer Services Artifact
      with:
        file: 'docker-compose-customer.tar.gz'
        target: 'docker-compose-artifact/docker-compose-customer.tar.gz'
        repo: ansys/hps-release-mirror
        version: tags/${{ inputs.version }}
        token: ${{ inputs.token }}

    - if: ${{ inputs.version == 'latest-dev' }}
      name: Download Latest Mirrored Internal Services Artifact
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        release_tag="$(gh release view --repo ansys/hps-release-mirror --json tagName --jq '.tagName')"
        if [ -z "$release_tag" ]; then
          echo "Could not resolve the latest HPS mirror release tag" >&2
          exit 1
        fi
        echo "Resolved latest HPS mirror release tag: $release_tag"
        gh release download "$release_tag" \
          --repo ansys/hps-release-mirror \
          --pattern 'docker-compose-internal.tar.gz' \
          --dir docker-compose-artifact

    - uses: KengoTODA/actions-setup-docker-compose@477353946803dd64eaa44008b865b6bfc88cab4e # v1.2.4
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Login in Github Container registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-token }}

    - name: Start services (customer package)
      if: ${{ inputs.version != 'latest-dev' }}
      shell: bash
      run: |
        ls -la
        tar -xvzf docker-compose-customer.tar.gz
        mv docker-compose-customer docker-compose
        cd docker-compose
        if [ -f docker-compose.yaml ]; then

          # Workaround: use legacy bitnami images
          echo "Applying bitnami -> bitnamilegacy image replacement"
          sed -i 's|image: bitnami/|image: bitnamilegacy/|g' docker-compose.yaml
          
          # Workaround: bump traefik version because not compatible with latest docker api
          echo "Applying traefik version bump"
          sed -i 's/image: traefik:v3\.3/image: traefik:v3.6.7/' docker-compose.yaml

          # Workaround: avoid building two containers using the same image name
          echo "Applying monitor image name change"
          sed -i '0,/image: monitor:build/s//image: monitor-query:build/' docker-compose.yaml
        fi
        docker-compose build
        docker-compose up -d
      working-directory: ./docker-compose-artifact

    - name: Start services (internal package)
      if: ${{ inputs.version == 'latest-dev' }}
      env:
        PROFILE: ${{ inputs.profile }}
      shell: bash
      run: |
        echo "$(pwd)"
        pwd
        ls -la
        tar -xvzf docker-compose-internal.tar.gz
        cd docker-compose

        if [ -f config/minio/minio-compose.yaml ]; then
          # Workaround: use quay.io images for minio
          echo "Applying quay.io image replacement for minio"
          sed -i 's|image: minio/|image: quay.io/minio/|g' config/minio/minio-compose.yaml
        fi
        
        docker-compose pull
        if [ -z "$PROFILE" ]; then
          docker-compose up -d
        else
          docker-compose --profile $PROFILE up -d
        fi        
      working-directory: ./docker-compose-artifact

    - name: Wait for services
      env:
        PROFILE: ${{ inputs.profile }}
      shell: bash
      run: |
        # retry each service max 20 times
        if [ "$PROFILE" = "backend" ]; then
          wget --retry-connrefused --retry-on-http-error=503,404,502 --no-check-certificate -t 20 -O- https://localhost:8443/hps/dt/api/v1          
        else
          wget --retry-connrefused --retry-on-http-error=503,404 --no-check-certificate -t 20 -O- https://localhost:8443/hps/jms/api/v1
          wget --retry-connrefused --retry-on-http-error=503,404 --no-check-certificate -t 20 -O- https://localhost:8443/hps/fs/api/v1
          wget --retry-connrefused --retry-on-http-error=503,404 --no-check-certificate -t 20 -O- https://localhost:8443/hps/rms/api/v1
        fi
          

    - name: Set outputs
      id: set-outputs
      shell: bash
      run: |
        echo "url=https://localhost:8443/hps" >> $GITHUB_OUTPUT
        echo "path=$(pwd)" >> $GITHUB_OUTPUT
      working-directory: ./docker-compose-artifact/docker-compose
